name: Auto-bump SDK pin

# Listener: triggered by gdx-js-sdk notify-examples.yml (repository_dispatch
# of type gdx-sdk-changed) or manually. Clones gdx-js-sdk at the dispatched
# SHA, runs scripts/refresh_sdk.sh (which npm-packs the upstream SDK,
# rewrites package.json to point at the new tarball, and updates
# sdk/UPSTREAM_REF + sdk/TARBALL_NAME), regenerates package-lock.json,
# and opens a rolling PR if any drift.

on:
  repository_dispatch:
    types: [gdx-sdk-changed]
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: gdx-js-sdk commit SHA to vendor (for manual testing)
        required: true
        type: string

permissions:
  contents: read

jobs:
  bump:
    name: Refresh sdk/ + open PR if changed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mint App token (local-repo writes)
        id: app-token-local
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-js-sdk-examples
          permission-contents: write
          permission-pull-requests: write

      - name: Mint App token (upstream + submodule read)
        id: app-token-upstream
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          # gdx-proto is a submodule of gdx-js-sdk; the upstream checkout below
          # fetches it with submodules: recursive, which needs read access here.
          repositories: gdx-js-sdk,gdx-proto
          permission-contents: read

      - name: Checkout examples (this repo)
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token-local.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Resolve SDK SHA
        id: sha
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sdk_sha }}
          INPUT_SHA: ${{ inputs.sdk_sha }}
        run: |
          SHA="${DISPATCH_SHA:-$INPUT_SHA}"
          if [ -z "$SHA" ]; then
            echo "::error::No sdk_sha in dispatch payload and no workflow_dispatch input."
            exit 1
          fi
          echo "sdk_sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Vendoring gdx-js-sdk@${SHA}"

      - name: Checkout upstream gdx-js-sdk at dispatched SHA (with proto submodule)
        uses: actions/checkout@v5
        with:
          repository: gq-godark/gdx-js-sdk
          ref: ${{ steps.sha.outputs.sdk_sha }}
          path: upstream
          token: ${{ steps.app-token-upstream.outputs.token }}
          fetch-depth: 1
          # actions/checkout injects the token above as the submodule auth
          # header, so the private gdx-proto submodule clones cleanly (the old
          # `git clone --recurse-submodules` left gdx-proto's URL unauthenticated
          # and the job failed with "could not read Username for github.com").
          submodules: recursive

      - name: Refresh vendored sdk/
        run: bash scripts/refresh_sdk.sh "${GITHUB_WORKSPACE}/upstream"

      - name: Regenerate package-lock against new tarball
        run: |
          # refresh_sdk.sh rewrites package.json to point at the new tarball
          # filename; we need a fresh package-lock.json so npm install in the
          # release pipeline (and in recipient bundles) is reproducible.
          npm install --package-lock-only --no-audit --no-fund

      - name: Detect drift
        id: drift
        run: |
          if git diff --quiet -- sdk/ package.json package-lock.json; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No changes after refresh."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- sdk/ package.json package-lock.json
          fi

      - name: Configure git + open rolling PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-local.outputs.token }}
          BRANCH: auto/bump-sdk-pin
          SDK_SHA: ${{ steps.sha.outputs.sdk_sha }}
        run: |
          set -euo pipefail
          git config user.name "gdx-app[bot]"
          git config user.email "gdx-app[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add sdk/ package.json package-lock.json
          git commit -m "chore(sdk): vendor @godark/sdk tarball from gdx-js-sdk@${SDK_SHA}

          Auto-generated by .github/workflows/auto-bump-sdk-pin.yml in
          response to a gdx-sdk-changed dispatch event. Re-packs the
          upstream SDK at the new commit, drops the resulting tarball
          under sdk/, and bumps sdk/UPSTREAM_REF + sdk/TARBALL_NAME +
          package.json + package-lock.json to match.

          Review notes:
          - The sdk/ tarball is opaque (npm pack output); the meaningful
            review is the package.json + UPSTREAM_REF diff plus a quick
            scan of the upstream changelog at the new SHA.
          - The release pipeline (release.yml) re-packs upstream at the
            new pin and content-diffs it against the vendored tarball,
            so any tampering between dispatch and merge fails CI loudly."
          git push --force origin "$BRANCH"

          # Only treat an OPEN PR as "existing"; `gh pr view <branch>` also
          # matches a previously merged/closed rolling PR, which would suppress
          # opening a fresh one for the next merge cycle.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "Existing open PR force-pushed; no new PR opened."
            gh pr view "$BRANCH" --json url --jq .url
          else
            gh pr create \
              --title "auto: bump vendored SDK to ${SDK_SHA:0:7}" \
              --body "Vendors \`sdk/godark-sdk-*.tgz\` from \`gq-godark/gdx-js-sdk@${SDK_SHA}\` and bumps \`sdk/UPSTREAM_REF\` to match.

          - **Source repo**: \`gq-godark/gdx-js-sdk\`
          - **Source SHA**: \`${SDK_SHA}\`
          - **Workflow**: [.github/workflows/auto-bump-sdk-pin.yml](https://github.com/gq-godark/gdx-js-sdk-examples/blob/main/.github/workflows/auto-bump-sdk-pin.yml)

          ### Review checklist
          - [ ] Skim the upstream changelog between the previous \`sdk/UPSTREAM_REF\` and this SHA for any API breakage (signature changes, removed exports, renamed enum values).
          - [ ] If new push streams or wire fields landed, open a follow-up to surface them in the examples / docs.
          - [ ] Confirm CI is green (\`release.yml\` parity check + recipient smoke must pass).

          Merge to \`main\` to cut a new GitHub Release zip via \`release.yml\`." \
              --base main \
              --head "$BRANCH" \
              --label automation \
              --label sdk-bump
          fi
